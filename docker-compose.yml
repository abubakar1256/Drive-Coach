services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: driving_routes
      POSTGRES_USER: routepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - routepilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routepilot -d driving_routes"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://routepilot:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/driving_routes?schema=public
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace-with-a-long-random-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-routepilot}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_SERVER_URL: http://api:4000
    environment:
      API_SERVER_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  routepilot-db:
